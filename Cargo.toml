[package]
name = "memo"
version = "0.1.0"
edition = "2024"
description = "Keep decisions, environment quirks, and workflow lessons across agent sessions"
authors = ["Christopher Cummings"]
license = "MIT"
repository = "https://github.com/averagechris/memo"
homepage = "https://github.com/averagechris/memo"
readme = "README.md"
categories = ["command-line-utilities"]

[[bin]]
name = "memo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = "s"
panic = "abort"
